  db:
    image: postgres:16-alpine
    container_name: postgres-noa
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data-postgres:/var/lib/postgresql/data
      # Si necesitas tunear la config, Postgres usa postgresql.conf
      - ./conf/postgres/my-postgres.conf:/etc/postgresql/postgresql.conf
    command: >
      postgres  -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      # Usamos pg_isready para verificar si el servidor acepta conexiones
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - monitoring

  front:
    image: picohbk/noagestionfront:1.0.0.28
    container_name: noagestion-front
    ports:
      - "5000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped

  api:
    image: danielmchachagua/noagestionback:1.0.0
    container_name: noa-gestion
    ports:
      - "3000:3000"
      - "50051:50051"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups
    networks:
      - default
      - monitoring
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ecommerce:
  #   image: danielmchachagua/ecommercenoagestionback:0.1.21
  #   container_name: noa-ecommerce
  #   ports:
  #     - "3001:3001"
  #   env_file:
  #     - .env
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   volumes:
  #     - ./backups:/app/backups
